name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build debug APK
        run: |
          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug
          else
            gradle assembleDebug
          fi

      - name: Package APK as ZIP
        shell: bash
        run: |
          set -e
          mkdir -p release
          find . -type f -name '*.apk' -path '*/build/outputs/*' -exec cp {} release/ \;

          if ! find release -type f -name '*.apk' | grep -q .; then
            echo 'No APK was produced.'
            find . -type f -path '*/build/outputs/*' -print
            exit 1
          fi

          cd release
          zip -9 ../app-debug.zip ./*.apk
          cd ..
          unzip -l app-debug.zip

      - name: Upload APK ZIP
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-zip
          path: app-debug.zip
          if-no-files-found: error
