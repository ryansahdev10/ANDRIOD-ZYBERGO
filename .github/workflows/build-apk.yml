    - name: Package APK as ZIP
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p release

        mapfile -t apks < <(find . -type f -name '*.apk' -path '*/build/outputs/*' -print)

        if [ "${#apks[@]}" -eq 0 ]; then
          echo "No APK was produced."
          exit 1
        fi

        cp "${apks[@]}" release/
        (cd release && zip -9 ../app-debug.zip ./*.apk)

    - name: Upload APK ZIP
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-zip
        path: app-debug.zip
        if-no-files-found: error
